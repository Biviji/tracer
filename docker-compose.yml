# One command to run TRACE locally / on the Vultr VM:  docker compose up --build
# Settings come from .env (copy .env.example). Without it, everything runs offline:
# fake AI model + simulated sandboxes.
services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_USE_MOCK: "false"
        NEXT_PUBLIC_API_URL: /api
        ORCHESTRATOR_URL: http://orchestrator:8000
    ports:
      - "3000:3000"
    depends_on:
      - orchestrator
    restart: unless-stopped

  orchestrator:
    build: ./orchestrator
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: sqlite:////data/trace.db
      DEMO_REPO_DIR: /demo-repo
    volumes:
      - trace-data:/data
      # Lets the orchestrator start/destroy sandbox containers (SANDBOX_DRIVER=docker).
      # Only the orchestrator gets this; sandboxes get no socket, no network, no secrets.
      - /var/run/docker.sock:/var/run/docker.sock
      # Built-in demo project (repo field: "demo").
      - ./demo-repo:/demo-repo:ro
    # Group that owns docker.sock: 0 on Docker Desktop; on a Linux VM use
    # DOCKER_GID=$(stat -c %g /var/run/docker.sock) in .env
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      - sandbox-image
    expose: ["8000"]
    restart: unless-stopped

  # Builds the sandbox image the orchestrator starts per run, then exits.
  sandbox-image:
    build: ./runner
    image: trace-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

volumes:
  trace-data:
