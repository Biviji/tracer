# CI on every push and pull request; deploy to the Vultr VM when main is green.
#
# Deploy needs, in GitHub → Settings → Secrets and variables → Actions:
#   secrets  DEPLOY_SSH_KEY       private key allowed to ssh root@DEPLOY_HOST (a deploy-only key)
#            DEPLOY_KNOWN_HOSTS   output of: ssh-keyscan -t ed25519 <DEPLOY_HOST>
#   vars     DEPLOY_HOST          e.g. 144.202.16.76
#            SITE_URL             e.g. https://144-202-16-76.sslip.io
# The server keeps its own .env; CI never sees model keys.
name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  orchestrator:
    name: Orchestrator (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orchestrator/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check app tests
      # The sandbox image lets the real-Docker tests run (isolation, check, tamper detection)
      # instead of skipping.
      - run: docker build -t trace-sandbox:latest ../runner
      - run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # includes the type check
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to Vultr
    needs: [orchestrator, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A GitHub environment: add required reviewers there to make every deploy need a click.
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      # Unpack into a fresh directory (so deleted files really disappear), carry over the
      # server's .env, swap, rebuild. The previous release stays in /opt/tracer.prev for rollback.
      - name: Ship and rebuild
        run: |
          git archive --format=tar HEAD | ssh "root@${{ vars.DEPLOY_HOST }}" 'set -eu
            rm -rf /opt/tracer.next && mkdir -p /opt/tracer.next
            tar -x -C /opt/tracer.next
            for f in .env .env.site-password; do
              if [ -f "/opt/tracer/$f" ]; then cp -p "/opt/tracer/$f" /opt/tracer.next/; fi
            done
            rm -rf /opt/tracer.prev
            mv /opt/tracer /opt/tracer.prev
            mv /opt/tracer.next /opt/tracer
            cd /opt/tracer
            docker compose -p tracer -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f'
      - name: Smoke test
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.SITE_URL }}/api/health"
          curl -fsS -o /dev/null "${{ vars.SITE_URL }}/"
