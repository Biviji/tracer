# Tool config only — dependencies live in requirements*.txt.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long strings (prompts, messages) read better unwrapped.
ignore = ["E501"]
